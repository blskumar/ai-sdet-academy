<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AI SDET Academy</title>
<script>try{var t=localStorage.getItem("ai-sdet-academy-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  --bg:#f7f7f4; --panel:#ffffff; --ink:#1c1f23; --muted:#5f6670; --line:#e1e1da;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3f0e9; --warn:#8a5a00; --warn-soft:#fbf1d9;
  --code-bg:#f0f0ea; --pre-bg:#16191d; --pre-ink:#e8eaed; --focus:#1a73e8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1c1f24; --ink:#e8e9ec; --muted:#9aa1ab; --line:#2c3037;
    --accent:#6fc79a; --accent-ink:#0e1a14; --accent-soft:#1d2f26; --warn:#e5b64a; --warn-soft:#2e2713;
    --code-bg:#262a31; --pre-bg:#0d0f12; --pre-ink:#e8eaed;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1c1f24; --ink:#e8e9ec; --muted:#9aa1ab; --line:#2c3037;
  --accent:#6fc79a; --accent-ink:#0e1a14; --accent-soft:#1d2f26; --warn:#e5b64a; --warn-soft:#2e2713;
  --code-bg:#262a31; --pre-bg:#0d0f12; --pre-ink:#e8eaed;
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.overall{flex:1;min-width:160px;max-width:360px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.overall small{color:var(--muted);font-size:13px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 62px)}
nav.side{border-right:1px solid var(--line);padding:12px;background:var(--panel)}
nav.side button.ph{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:10px;border-radius:10px;margin-bottom:4px}
nav.side button.ph:hover{background:var(--accent-soft)}
nav.side button.ph[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.ph b{display:block;font-size:15px}
.ph span{font-size:12px;color:var(--muted)}
.ph .bar{margin-top:6px;height:5px}
main{padding:20px 24px 60px;max-width:900px;width:100%}
.phase-head h2{margin:0 0 4px;font-size:26px}
.phase-head p{margin:4px 0;color:var(--muted)}
.deliv{margin:12px 0;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0}
.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
.card[open]>summary::before{transform:rotate(90deg)}
.card .body{padding:0 16px 16px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--code-bg);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1}
.md h3{margin:18px 0 6px;font-size:18px}
.md p{margin:8px 0}
.md ul,.md ol{padding-left:22px;margin:8px 0}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
code{background:var(--code-bg);padding:1px 5px;border-radius:5px;font:13.5px/1.4 ui-monospace,Consolas,Menlo,monospace}
pre{background:var(--pre-bg);color:var(--pre-ink);padding:12px 14px;border-radius:10px;overflow:auto;position:relative;margin:10px 0}
pre code{background:none;padding:0;color:inherit;font-size:13px;white-space:pre}
.copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px;background:#ffffff1a;color:#fff;border:1px solid #ffffff40;border-radius:6px}
.sect{margin-top:18px}
.sect h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.crit label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
.crit input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}
.hint{margin:8px 0;padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0}
.hint small{color:var(--warn);font-weight:700}
.stuck{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.stuck .note{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:80px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:14px/1.5 inherit;resize:vertical}
.res li{margin:6px 0}
.themebox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.themebox select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 8px;border-radius:8px;font:inherit;font-size:14px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.chipbtn.met{background:var(--accent-soft);border-color:var(--accent)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.hero .big{font-size:56px;font-weight:800;line-height:1;color:var(--accent)}
.hero small{display:block;color:var(--muted)}
.today{margin:16px 0}
.today .bar{height:12px}
.timer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.timer .clock{font:700 28px/1 ui-monospace,Consolas,Menlo,monospace;min-width:110px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:8px 0}
.day{border-radius:6px;background:var(--line);height:44px;position:relative;overflow:hidden;border:1px solid var(--muted)}
.day i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.8}
.day.met i{opacity:1}
.day.today-cell{border:2px solid var(--ink)}
.daylbl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.cup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.cup.locked svg{opacity:.45}
@media (max-width:480px){
  header.top{position:static}
  .layout{min-height:auto}
  .days,.daylbl{gap:2px}
}
.cup b{display:block;font-size:14px;margin-top:4px}
.cup span{font-size:12px;color:var(--muted)}
.form{padding:14px 16px}
.form label.f{display:block;margin:10px 0 2px;font-weight:600;font-size:14px}
.form input[type=text],.form input[type=password],.form input[type=url]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.form .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.form .chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0}
.form .chk input{margin-top:4px;accent-color:var(--accent)}
.note-warn{padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;font-size:14px;margin:10px 0}
.chk-row{display:grid;grid-template-columns:minmax(120px,200px) 76px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chk-row:first-child{border-top:0}
.chip.fail{background:var(--warn-soft);color:var(--warn)}
.chip.run{background:var(--accent-soft);color:var(--accent)}
@media (max-width:600px){.chk-row{grid-template-columns:1fr;gap:4px}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:8px 12px}
  nav.side button.ph{min-width:150px;margin:0}
  main{padding:16px}
  .tools{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <h1>AI SDET Academy</h1>
  <div class="overall"><div class="bar"><i id="overallBar"></i></div><small id="overallTxt"></small></div>
  <button class="btn chipbtn" id="streakChip" data-a="view-streak" title="Daily streak and rewards"></button>
  <div class="tools">
    <label class="themebox">Theme
      <select id="themeSel" aria-label="Theme">
        <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
      </select>
    </label>
    <button class="btn" data-a="export">Export progress</button>
    <button class="btn" data-a="import">Import</button>
    <button class="btn" data-a="reset">Reset</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Phases"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="content1.js"></script>
<script src="content2.js"></script>
<script>
(function(){
  var P = window.PHASES;
  var KEY = "ai-sdet-academy-v1";
  var view = {phase: P[0].id, tab: "learn"};
  var HINTS = Object.create(null);
  P.forEach(function(p){ p.exercises.forEach(function(e){ HINTS[e.id] = e.hints.length; }); });

  function map(){ return Object.create(null); }
  function blank(){ return {read:map(), crit:map(), hints:map(), help:map(), notes:map(), done:map(), log:map(), cups:map(), timer:{start:null, acc:0}}; }
  function isObj(o){ return o && typeof o === "object" && !Array.isArray(o); }
  function clamp(n, max){ n = parseInt(n, 10); return isNaN(n) ? 0 : Math.max(0, Math.min(max, n)); }
  // Build state only from known keys with coerced values; never trust stored/imported JSON shape.
  function sanitize(o){
    var s = blank();
    if (!isObj(o)) return s;
    ["read","done"].forEach(function(k){
      if (isObj(o[k])) Object.keys(o[k]).forEach(function(x){ if (x !== "__proto__" && o[k][x] === true) s[k][x] = true; });
    });
    if (isObj(o.crit)) Object.keys(o.crit).forEach(function(x){
      if (x !== "__proto__" && Array.isArray(o.crit[x])) s.crit[x] = o.crit[x].slice(0, 20).map(function(v){ return v === true; });
    });
    if (isObj(o.hints)) Object.keys(o.hints).forEach(function(x){ if (HINTS[x] !== undefined) s.hints[x] = clamp(o.hints[x], HINTS[x]); });
    if (isObj(o.help)) Object.keys(o.help).forEach(function(x){ if (HINTS[x] !== undefined) s.help[x] = clamp(o.help[x], 2); });
    if (isObj(o.notes)) Object.keys(o.notes).forEach(function(x){ if (HINTS[x] !== undefined && typeof o.notes[x] === "string") s.notes[x] = o.notes[x].slice(0, 20000); });
    if (isObj(o.log)) Object.keys(o.log).forEach(function(x){
      var v = Number(o.log[x]);
      if (realDate(x) && isFinite(v) && v > 0) s.log[x] = Math.min(1440, Math.round(v*100)/100);
    });
    if (isObj(o.cups)) Object.keys(o.cups).forEach(function(x){
      if (CUPS.some(function(c){ return c.id === x; }) && realDate(String(o.cups[x]))) s.cups[x] = String(o.cups[x]);
    });
    if (isObj(o.timer)){
      var st = Number(o.timer.start), ac = Number(o.timer.acc), now = Date.now();
      s.timer.acc = isFinite(ac) && ac > 0 ? Math.min(MAX_SESSION, ac) : 0;
      // a running start in the future or older than 24 h is a forgotten or corrupt timer: drop it
      s.timer.start = isFinite(st) && st > 0 && st <= now && now - st < 86400000 ? st : null;
    }
    return s;
  }
  // YYYY-MM-DD that is a real calendar day and not in the future (local time)
  function realDate(x){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(x); if (!m) return false;
    var d = new Date(+m[1], +m[2]-1, +m[3]);
    var back = d.getFullYear() + "-" + (d.getMonth()+1 < 10 ? "0" : "") + (d.getMonth()+1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
    var t = new Date(), today = t.getFullYear() + "-" + (t.getMonth()+1 < 10 ? "0" : "") + (t.getMonth()+1) + "-" + (t.getDate() < 10 ? "0" : "") + t.getDate();
    return back === x && x <= today;
  }
  var S = blank();   // real state is loaded below, after CUPS is defined (sanitize needs it)
  function load(){
    try { var r = localStorage.getItem(KEY); if (r) return sanitize(JSON.parse(r)); } catch(e){}
    return blank();
  }
  var warned = false;
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ if (!warned){ warned = true; toast("Progress could not be saved in this browser. Use Export to keep a backup."); } }
  }
  // ---------- theme: system / light / dark ----------
  var THEME_KEY = "ai-sdet-academy-theme", mq = window.matchMedia("(prefers-color-scheme: dark)");
  function getTheme(){ try { var t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") return t; } catch(e){} return "system"; }
  function applyTheme(t){
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    var sel = document.getElementById("themeSel");
    if (sel){
      sel.value = t;
      sel.options[0].textContent = t === "system" ? "System (browser says " + (mq.matches ? "dark" : "light") + ")" : "System";
      sel.title = "System follows the colour scheme your BROWSER reports. On Windows that comes from Settings > Personalization > Colors > 'Choose your default app mode' (not the taskbar 'Windows mode'), and Chrome, Edge and Firefox each have their own Appearance setting that can override it.";
    }
  }
  function setTheme(t){ try { localStorage.setItem(THEME_KEY, t); } catch(e){} applyTheme(t); }
  var onMq = function(){ if (getTheme() === "system") applyTheme("system"); };
  if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  applyTheme(getTheme());

  // ---------- daily streak (goal: 60 min a day) ----------
  var GOAL = 60;
  var MAX_SESSION = 4 * 3600;   // one session counts at most 4 h, so a forgotten timer cannot award a day or a cup
  // Fictional rewards. Earned once the best streak reaches the day count, kept for good.
  var CUPS = [
    {id:"bronze",   days:3,   name:"Bronze Sprint Cup",           color:"#b0703a"},
    {id:"silver",   days:7,   name:"Silver Week Cup",             color:"#9aa3ad"},
    {id:"gold",     days:14,  name:"Golden Fortnight Chalice",    color:"#e0a800"},
    {id:"platinum", days:30,  name:"Platinum Month Trophy",       color:"#4fb0c9"},
    {id:"diamond",  days:60,  name:"Diamond Grandmaster Goblet",  color:"#6c8cff"},
    {id:"legend",   days:100, name:"Legendary Eval-Hunter Cup",   color:"#c05cd6"}
  ];
  S = load();
  awardCups(true);   // re-check after load so imported/old data shows the right cups
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function ds(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function dayNum(k){ var p = k.split("-"); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000); }
  function met(k){ return (S.log[k] || 0) >= GOAL; }
  function rawSec(){ return S.timer.acc + (S.timer.start ? Math.max(0, (Date.now() - S.timer.start) / 1000) : 0); }
  function elapsedSec(){ return Math.min(MAX_SESSION, rawSec()); }
  function todayMin(){ return (S.log[ds(new Date())] || 0) + elapsedSec() / 60; }
  function streakInfo(){
    var c = new Date(), cur = 0;
    if (!met(ds(c))) c.setDate(c.getDate() - 1);        // today not done yet: streak is still alive through yesterday
    while (met(ds(c))){ cur++; c.setDate(c.getDate() - 1); }
    var keys = Object.keys(S.log).filter(met).map(dayNum).sort(function(a,b){ return a-b; }), best = 0, run = 0, prev = null;
    keys.forEach(function(n){ run = (prev !== null && n === prev + 1) ? run + 1 : 1; prev = n; if (run > best) best = run; });
    return {cur: cur, best: Math.max(best, cur)};
  }
  function awardCups(silent){          // returns the names of cups newly earned; does not toast, the caller does
    var best = streakInfo().best, won = [];
    CUPS.forEach(function(c){ if (best >= c.days && !S.cups[c.id]){ S.cups[c.id] = ds(new Date()); won.push(c.name); } });
    return won;
  }
  function credit(k, min){ S.log[k] = Math.min(1440, Math.round(((S.log[k] || 0) + min) * 100) / 100); }
  function commitTimer(){
    var e = elapsedSec(), now = new Date();
    if (e > 0){
      var started = S.timer.start ? new Date(S.timer.start) : now;
      if (ds(started) !== ds(now)){      // session crossed midnight: split it so yesterday's goal still counts
        var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        var after = Math.min(e, Math.max(0, (now.getTime() - midnight) / 1000));
        credit(ds(now), after / 60); credit(ds(started), (e - after) / 60);
      } else credit(ds(now), e / 60);
    }
    S.timer = {start: null, acc: 0};
  }
  function addMinutes(n){ credit(ds(new Date()), n); }
  function fmtClock(sec){ sec = Math.floor(sec); return pad(Math.floor(sec/3600)) + ":" + pad(Math.floor(sec%3600/60)) + ":" + pad(sec%60); }
  function cupSvg(color){
    return '<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M16 8h32v14c0 10-7 18-16 18S16 32 16 22z" fill="'+color+'"/>'
      + '<path d="M16 12H6c0 10 4 16 12 18M48 12h10c0 10-4 16-12 18" fill="none" stroke="'+color+'" stroke-width="4"/>'
      + '<rect x="29" y="40" width="6" height="10" fill="'+color+'"/><rect x="20" y="50" width="24" height="6" rx="2" fill="'+color+'"/></svg>';
  }
  function streakHtml(){
    var si = streakInfo(), mins = todayMin(), pct = Math.min(100, Math.round(mins / GOAL * 100)), running = !!S.timer.start;
    var h = '<div class="phase-head"><h2>Daily streak</h2><p>Goal: '+GOAL+' minutes of study a day. Hit it to extend your streak and unlock fictional cups.</p></div>';
    h += '<div class="hero"><div><span class="big" id="sCur">'+si.cur+'</span><small>day streak</small></div>'
      + '<div><b id="sBest">'+si.best+'</b><small>best streak</small></div>'
      + '<div><b>'+Object.keys(S.cups).length+' / '+CUPS.length+'</b><small>cups earned</small></div></div>';
    h += '<div class="today card" style="padding:14px 16px"><strong>Today: <span id="tToday">'+Math.floor(mins)+'</span> / '+GOAL+' min</strong>'
      + '<div class="bar" style="margin:8px 0"><i id="tBar" style="width:'+pct+'%"></i></div>'
      + '<div class="timer"><span class="clock" id="tClock" role="timer" aria-label="Session timer">'+fmtClock(elapsedSec())+'</span>'
      + (running || S.timer.acc > 0
          ? '<button class="btn primary" data-a="t-stop">Stop &amp; save</button>'
          : '<button class="btn primary" data-a="t-start">Start studying</button>')
      + '<span style="color:var(--muted);font-size:13px">'+(running ? 'Running. Time counts toward your streak only after you stop &amp; save (max 4 h per session).' : 'A session counts up to 4 hours.')+'</span></div>'
      + '<div class="timer"><span>Studied offline? Add:</span>'
      + [10,15,30,60].map(function(n){ return '<button class="btn" data-a="add-min" data-n="'+n+'">+'+n+' min</button>'; }).join("")
      + '<button class="btn" data-a="reset-today">Reset today</button></div>'
      + '<small style="color:var(--muted)">Be honest with yourself. The only person this reward fools is you.</small></div>';
    var labels = "", cells = "", today = new Date();
    for (var i = 13; i >= 0; i--){
      var d = new Date(today); d.setDate(today.getDate() - i);

      if (/^##\s/.test(l)){ flushPara(); closeList(); out.push("<h3>"+inline(l.replace(/^##\s/,""))+"</h3>"); }
      else if (/^>\s?/.test(l)){ flushPara(); closeList(); out.push("<blockquote>"+inline(l.replace(/^>\s?/,""))+"</blockquote>"); }
      else if (/^\d+\.\s/.test(l)){ flushPara(); if (list!=="ol"){ closeList(); out.push('<ol start="'+l.match(/^(\d+)\./)[1]+'">'); list="ol"; } out.push("<li>"+inline(l.replace(/^\d+\.\s/,""))+"</li>"); }
      else if (/^-\s/.test(l)){ flushPara(); if (list!=="ul"){ closeList(); out.push("<ul>"); list="ul"; } out.push("<li>"+inline(l.replace(/^-\s/,""))+"</li>"); }
      else if (/^\s*$/.test(l)){ flushPara(); closeList(); }
      else { closeList(); para.push(l); }
      i++;
    }
    flushPara(); closeList();
    return '<div class="md">'+out.join("\n")+"</div>";
  }

  // ---------- progress ----------
  function phaseStats(p){
    var secs = p.learn.length, read = 0, ex = p.exercises.length, done = 0;
    p.learn.forEach(function(_,i){ if (S.read[p.id+":"+i]) read++; });
    p.exercises.forEach(function(e){ if (S.done[e.id]) done++; });
    return {pct: Math.round((read+done)/(secs+ex)*100), read:read, secs:secs, done:done, ex:ex};
  }
  function overall(){
    var t=0,d=0; P.forEach(function(p){ var s=phaseStats(p); t+=s.secs+s.ex; d+=s.read+s.done; });
    return {pct: t? Math.round(d/t*100):0, d:d, t:t};
  }

  // ---------- render ----------
  function el(id){ return document.getElementById(id); }
  function renderSide(){
    var si = streakInfo();
    el("side").innerHTML = '<button class="ph" data-a="view-streak" aria-current="'+(view.phase==="streak")+'">'
      + '<b>Daily streak</b><span>'+si.cur+' day'+(si.cur===1?'':'s')+' &middot; goal '+GOAL+' min a day</span></button>'
      + '<button class="ph" data-a="view-live" aria-current="'+(view.phase==="live")+'">'
      + '<b>API key &amp; live checks</b><span>'+(getSecret() ? 'Key saved' + (llm.model ? ' &middot; ' + esc(llm.model.slice(0, 28)) : '') : 'Optional &middot; no key yet')+'</span></button>'
      + P.map(function(p){
      var s = phaseStats(p);
      return '<button class="ph" data-a="phase" data-id="'+p.id+'" aria-current="'+(view.phase===p.id)+'">'
        + '<b>'+p.n+'. '+esc(p.title)+'</b><span>'+p.weeks+' &middot; '+s.pct+'%</span>'
        + '<div class="bar"><i style="width:'+s.pct+'%"></i></div></button>';
    }).join("");
  }
  function renderTop(){
    var o = overall();
    el("overallBar").style.width = o.pct+"%";
    el("overallTxt").textContent = o.pct+"% complete ("+o.d+" of "+o.t+" items)";
  }
  function currentPhase(){ return P.filter(function(p){ return p.id===view.phase; })[0]; }

  function renderMain(){
    if (view.phase === "streak"){ el("main").innerHTML = streakHtml(); return; }
    if (view.phase === "live"){ el("main").innerHTML = liveHtml(); renderLiveResults(); return; }
    var p = currentPhase(), s = phaseStats(p);
    var h = '<div class="phase-head"><h2>Phase '+p.n+': '+esc(p.title)+'</h2><p>'+p.weeks+'</p><p>'+esc(p.goal)+'</p>'
      + '<div class="deliv"><strong>Deliverable:</strong> '+esc(p.deliverable)+'</div></div>';
    var tabs = [["learn","Learn ("+s.read+"/"+s.secs+")"],["exercises","Exercises ("+s.done+"/"+s.ex+")"],["resources","Resources"]];
    h += '<div class="tabs">'+tabs.map(function(t){
      return '<button data-a="tab" data-id="'+t[0]+'"'+(view.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';
    }).join("")+"</div>";
    if (view.tab==="learn") h += learnHtml(p);
    else if (view.tab==="exercises") h += exercisesHtml(p);
    else h += resourcesHtml(p);
    el("main").innerHTML = h;
  }

  function learnHtml(p){
    var h = "";
    if (p.setup) h += '<details class="card"><summary>Setup for the exercises (do this first)</summary><div class="body">'+md(p.setup)+"</div></details>";
    p.learn.forEach(function(sec,i){
      var k = p.id+":"+i, r = !!S.read[k];
      h += '<details class="card"'+(i===0?" open":"")+'><summary><span class="grow">'+(i+1)+'. '+esc(sec.t)+'</span>'
        + '<span class="chip'+(r?" done":"")+'">'+(r?"Read":"Unread")+'</span></summary><div class="body">'+md(sec.md)
        + '<p><button class="btn '+(r?"":"primary")+'" data-a="read" data-k="'+k+'">'+(r?"Mark as unread":"Mark as read")+'</button></p></div></details>';
    });
    return h;
  }

  function exercisesHtml(p){
    return p.exercises.map(function(e,i){
      var done = !!S.done[e.id], crit = S.crit[e.id] || [], hn = Math.min(S.hints[e.id] || 0, e.hints.length), help = S.help[e.id] || 0;
      var h = '<details class="card" data-ex="'+e.id+'"><summary><span class="grow">Exercise '+(i+1)+': '+esc(e.title)+'</span>'
        + '<span class="chip">'+e.time+'</span><span class="chip'+(done?" done":"")+'">'+(done?"Done":"To do")+'</span></summary><div class="body">';
      h += '<p><strong>Goal:</strong> '+inline(e.goal)+'</p>';
      h += '<div class="sect"><h4>Task</h4>'+md(e.task)+'</div>';
      h += '<div class="sect crit"><h4>Done when</h4>'+e.criteria.map(function(c,j){
        return '<label><input type="checkbox" data-a="crit" data-e="'+e.id+'" data-j="'+j+'"'+(crit[j]?" checked":"")+'><span>'+inline(c)+"</span></label>";
      }).join("")+"</div>";
      h += '<div class="sect"><h4>Need help?</h4>';
      for (var j=0;j<hn;j++) h += '<div class="hint"><small>Hint '+(j+1)+' of '+e.hints.length+'</small><br>'+inline(e.hints[j])+"</div>";
      if (help>=1) h += '<div class="hint"><small>Approach</small><br>'+inline(e.approach)+"</div>";
      if (help>=2) h += '<div class="sect"><h4>Reference solution</h4>'+md(e.solution)+"</div>";
      h += '<div class="stuck">';
      if (hn < e.hints.length) h += '<button class="btn warn" data-a="hint" data-e="'+e.id+'">Show hint '+(hn+1)+' of '+e.hints.length+'</button>';
      else if (help<1) h += '<button class="btn warn" data-a="help" data-e="'+e.id+'">Show approach</button>';
      else if (help<2) h += '<button class="btn warn" data-a="help" data-e="'+e.id+'">Show full solution</button>';
      h += '<span class="note">Try for 20 minutes before using hints. Reading a solution is fine, but retype it yourself, then change something to prove you understand it.</span></div></div>';
      h += '<div class="sect"><h4>My notes</h4><textarea data-a="note" data-e="'+e.id+'" aria-label="Notes for exercise '+(i+1)+'" placeholder="What worked, what broke, what you learned...">'+esc(S.notes[e.id]||"")+"</textarea></div>";
      h += '<p><button class="btn '+(done?"":"primary")+'" data-a="done" data-e="'+e.id+'">'+(done?"Mark as not done":"Mark exercise done")+"</button></p>";
      h += "</div></details>";
      return h;
    }).join("");
  }

  function resourcesHtml(p){
    return '<ul class="res">'+p.resources.map(function(r){
      return '<li><a href="'+r[1]+'" target="_blank" rel="noopener">'+esc(r[0])+"</a></li>";
    }).join("")+"</ul><p style=\"color:var(--muted)\">Links and library versions change. If a command differs from what you see in the docs, trust the docs.</p>";
  }

  // keep open cards open across re-render
  function withOpenState(fn){
    var open = Array.prototype.map.call(document.querySelectorAll("#main details[open]"), function(d,i){
      return d.getAttribute("data-ex") || ("i"+Array.prototype.indexOf.call(document.querySelectorAll("#main details"), d));
    });
    var y = window.scrollY;
    fn();
    var all = document.querySelectorAll("#main details");
    Array.prototype.forEach.call(all, function(d,i){
      var key = d.getAttribute("data-ex") || ("i"+i);
      d.open = open.indexOf(key) !== -1;
    });
    window.scrollTo(0,y);
  }
  function focusKey(){
    var a = document.activeElement;
    if (!a || !a.getAttribute || !a.getAttribute("data-a")) return null;
    return ["data-a","data-k","data-e","data-id","data-j","data-n"].map(function(n){ return a.getAttribute(n); });
  }
  function restoreFocus(k){
    if (!k) return;
    var names = ["data-a","data-k","data-e","data-id","data-j","data-n"];
    var swap = {"t-start":"t-stop", "t-stop":"t-start"};   // Start and Stop & save replace each other
    var c = document.querySelectorAll('[data-a="'+k[0]+'"]');
    for (var i=0;i<c.length;i++){
      if (names.every(function(n,j){ return c[i].getAttribute(n) === k[j]; })){ c[i].focus(); return; }
    }
    if (swap[k[0]]){ var sw = document.querySelector('[data-a="'+swap[k[0]]+'"]'); if (sw){ sw.focus(); return; } }
    // hint button turns into a "show approach/solution" button: keep focus on the same exercise's help control
    if (k[2]){
      var h = document.querySelector('[data-e="'+k[2]+'"][data-a="hint"], [data-e="'+k[2]+'"][data-a="help"]');
      if (h) h.focus();
    }
  }
  function refresh(){ var f = focusKey(); withOpenState(function(){ renderMain(); }); renderSide(); renderTop(); updateChip(); restoreFocus(f); }

  var toastTimer = null;
  function toast(t){
    var e=el("toast"); e.textContent=t; e.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ e.classList.remove("on"); }, 2600);
  }
  // one combined message when a save also unlocks cups
  function saved(msg, won){ toast(won.length ? msg + ". Reward unlocked: " + won.join(", ") : msg); }

  // ---------- events ----------
  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a"), id = b.getAttribute("data-id"), e = b.getAttribute("data-e");
    if (a==="phase"){ view.phase=id; view.tab="learn"; setHash(); renderAll(); window.scrollTo(0,0); el("main").focus(); }
    else if (a==="tab"){ view.tab=id; setHash(); var f=focusKey(); renderAll(); restoreFocus(f); }
    else if (a==="read"){ var k=b.getAttribute("data-k"); S.read[k]=!S.read[k]; save(); refresh(); }
    else if (a==="done"){ S.done[e]=!S.done[e]; save(); refresh(); }
    else if (a==="hint"){ S.hints[e]=(S.hints[e]||0)+1; save(); refresh(); }
    else if (a==="help"){
      var next=(S.help[e]||0)+1;
      if (next===2 && !confirm("Show the full solution? Try the approach first. You learn more by building it yourself.")) return;
      S.help[e]=next; save(); refresh();
    }
    else if (a==="copy"){
      var t = b.parentNode.querySelector("code").textContent;
      try { navigator.clipboard.writeText(t).then(function(){ toast("Copied"); }); } catch(x){ toast("Copy not available"); }
    }
    else if (a==="view-streak"){ view.phase="streak"; setHash(); renderAll(); window.scrollTo(0,0); el("main").focus(); }
    else if (a==="view-live"){ view.phase="live"; setHash(); renderAll(); window.scrollTo(0,0); el("main").focus(); }
    else if (a==="live-save"){ liveSave(); }
    else if (a==="live-clear"){ liveClear(); }
    else if (a==="live-models"){ liveModels(); }
    else if (a==="live-test"){ runChecks(["conn"]); }
    else if (a==="live-run"){ runChecks(["conn","json","tools","variance","canary"]); }
    else if (a==="t-start"){ S.timer.start=Date.now(); S.timer.acc=0; save(); refresh(); }
    else if (a==="t-stop"){ commitTimer(); var w1=awardCups(); save(); refresh(); saved("Session saved", w1); }
    else if (a==="add-min"){ addMinutes(+b.getAttribute("data-n")); var w2=awardCups(); save(); refresh(); saved("Added " + b.getAttribute("data-n") + " min", w2); }
    else if (a==="reset-today"){ if (confirm("Reset today's minutes to zero? Your timer will stop. Other days, streak history and earned cups are not changed.")){ delete S.log[ds(new Date())]; S.timer={start:null,acc:0}; save(); refresh(); } }
    else if (a==="export"){
      var exp = Object.assign({}, S, {timer:{start:null, acc:0}});   // never export a running timer
      var blob = new Blob([JSON.stringify(exp,null,2)],{type:"application/json"});
      var u = URL.createObjectURL(blob), l = document.createElement("a");
      l.href=u; l.download="ai-sdet-academy-progress.json"; l.click(); setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    }
    else if (a==="import"){ el("file").click(); }
    else if (a==="reset"){ if (confirm("Delete all progress and notes on this browser?")){ S=blank(); save(); renderAll(); } }
  });
  document.addEventListener("change", function(ev){
    var t = ev.target;
    if (t.id==="themeSel"){ setTheme(t.value); return; }
    if (t.getAttribute("data-a")==="crit"){
      var e=t.getAttribute("data-e"), j=+t.getAttribute("data-j");
      S.crit[e]=S.crit[e]||[]; S.crit[e][j]=t.checked; save();
    }
    if (t.id==="file" && t.files[0]){
      var r = new FileReader();
      r.onload = function(){
        var data;
        try { data = JSON.parse(r.result); } catch(x){ toast("Invalid file"); t.value=""; return; }
        if (!isObj(data)){ toast("Invalid file"); t.value=""; return; }
        if (confirm("Replace your current progress, streak and any running timer with the imported file?")){ S=sanitize(data); awardCups(); save(); renderAll(); toast("Progress imported"); }
        t.value = "";
      };
      r.readAsText(t.files[0]);
    }
  });
  document.addEventListener("input", function(ev){
    var t = ev.target;
    if (t.getAttribute("data-a")==="note"){ S.notes[t.getAttribute("data-e")]=t.value; save(); }
  });

  function renderAll(){ renderSide(); renderTop(); renderMain(); updateChip(); }
  function setHash(){
    var h = (view.phase === "streak" || view.phase === "live") ? "#"+view.phase : "#"+view.phase+"/"+view.tab;
    if (location.hash !== h) { try { history.pushState(null, "", h); } catch(e){} }
  }
  function fromHash(){
    var h = location.hash.replace("#","").split("/");
    view.phase = h[0]==="streak" || h[0]==="live" || P.some(function(p){ return p.id===h[0]; }) ? h[0] : P[0].id;
    view.tab = ["learn","exercises","resources"].indexOf(h[1])!==-1 ? h[1] : "learn";
  }
  window.addEventListener("hashchange", function(){ fromHash(); renderAll(); });
  // another tab changed progress: take its data instead of overwriting it on the next save
  window.addEventListener("storage", function(e){ if (e.key === KEY){ S = load(); renderAll(); } });
  fromHash(); renderAll();
})();
</script>
</body>
</html>
